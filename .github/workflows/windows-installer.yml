name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          cache: maven
      - name: Test and build the MSI
        shell: pwsh
        run: ./packaging/windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ShouGongJi-Windows-x64
          path: target/windows-package/installer/*.msi
          if-no-files-found: error
